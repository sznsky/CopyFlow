server:
  port: "8080"
  mode: debug

database:
  dsn: "root:root@tcp(127.0.0.1:3306)/copyflow?charset=utf8mb4&parseTime=True&loc=Local"

auth:
  jwt_secret: "change-me-in-production"
  wallet_encrypt_key: "0123456789abcdef0123456789abcdef"
  nonce_expire_minutes: 10

# Dune Analytics API（聪明钱分析）
dune:
  api_key: "sqKRtYDjhXqbk7XvXmI0PgVR7fUCITlp"
  query_id: 7727110  # Uniswap 交易查询 ID
  enabled: true

# 聪明钱配置
smartmoney:
  enabled: true
  chain_id: 1  # Ethereum
  min_amount_usd: 10000  # 10000+ USD 才算"聪明钱"大户交易
  days_back: 1           # 同步天数；PNL 需覆盖持仓周期，卖出匹配不到买入时可增大（如 30）
  top_wallet_count: 20
  min_wallet_score: 60
  signal_days: 3         # 信号聚合分析最近N天
  sync_interval_hours: 24  # 每天运行一次

# 邮件（MVP 默认关闭，验证码打印到 API 日志）
email:
  enabled: false
  host: smtp.gmail.com
  port: 587
  username: ""
  password: ""
  from: "noreply@copyflow.local"

worker:
  enabled: true
  poll_interval_sec: 3
  confirmations: 1

chains:
  bsc:
    chain_id: 56
    name: BSC
    rpc_url: "https://bsc-dataseed.binance.org"
    enabled: true
    native_symbol: BNB
    dex:
      pancake_v2:
        router: "0x10ED43C718714eb63d5aA57B78B54704E256024E"
        factory: "0xcA143Ce32Fe78f1f7019d7d551a6402fC5350c73"
        wrapped_native: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"
        enabled: true
  ethereum:
    chain_id: 1
    name: Ethereum
    rpc_url: "https://eth.llamarpc.com"
    enabled: false
    native_symbol: ETH
    dex:
      uniswap_v2:
        router: "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D"
        factory: "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f"
